name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://localhost:3000/api/health
          kill "$SERVER_PID"
