name: Build apps

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publicar os binários como release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            ext: ''
            native: true
          - os: ubuntu-22.04
            target: linux-arm64
            ext: ''
            native: false
          - os: windows-latest
            target: win-x64
            ext: '.exe'
            native: true
          - os: macos-13
            target: macos-x64
            ext: ''
            native: true
          - os: macos-14
            target: macos-arm64
            ext: ''
            native: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Gerar binário
        run: node scripts/build-app.js ${{ matrix.target }}

      - name: Smoke test do binário
        if: matrix.native
        shell: bash
        run: node scripts/smoke-binary.js "dist/duck-hermes-studio-${{ matrix.target }}${{ matrix.ext }}"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: duck-hermes-studio-${{ matrix.target }}
          path: dist/duck-hermes-studio-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Reunir binários
        run: |
          mkdir -p release
          find artifacts -type f -maxdepth 2 -exec cp {} release/ \;
          ls -la release

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
